plugins {
   id 'java'
   id 'application'
   id 'org.ajoberstar.git-publish' version '4.2.0'
}

repositories {
    mavenCentral()
}

task copyHtmlReports(type: Copy) {
    from 'src/main/html'
    into layout.buildDirectory.dir('reports')
}

task copyJavadocReports(type: Copy) {
    dependsOn javadoc
    from layout.buildDirectory.dir('docs/javadoc')
    into layout.buildDirectory.dir('reports/javadoc')
}

task reports {
    dependsOn 'build', copyHtmlReports, copyJavadocReports
}

gitPublish {
    repoUri = 'git@github.com:ODU-CS350-F26/CS350--lab4-documentation--Strossed.git'
    branch = 'gh-pages'

    contents {
        from(layout.buildDirectory.dir('reports'))
    }

    commitMessage = 'Publish project reports'
}

gitPublishCopy.dependsOn reports

task deployReports {
    dependsOn reports
    dependsOn gitPublishPush
}

java {
    sourceCompatibility = JavaVersion.toVersion(11)
    targetCompatibility = JavaVersion.toVersion(11)
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.hamcrest:hamcrest-library:2.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true
    testLogging {
        events "passed", "skipped", "failed"
        }
}

application { //Allows  ./gradlew run --args=path-to-test-data
    mainClass = 'edu.odu.cs.MostCommonWords'
}

